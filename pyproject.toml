[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiqs-si"
version = "0.1.0.dev1"
description = "Aiqs SI open shell: MCP service, account/auth UI and agent guide (resonance core is proprietary and not included)"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "PyJWT[crypto]==2.15.0",
  "Pillow==13.0.0",
  "httpx==0.28.1",
  "starlette==1.10.0",
  "uvicorn==0.41.0",
  "standardwebhooks==1.1.0",
]

[project.scripts]
aiqs-si-server = "aiqs_si.http_server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# The open shell ships the aiqs_si package plus the clearly-marked
# public stub packages for the proprietary intake and device layers
# (aiqs_si_core_intake / aiqs_si_device). The resonance engine
# package is not part of this repository at all.
include = ["aiqs_si", "aiqs_si.*", "aiqs_si_core_intake", "aiqs_si_core_intake.*", "aiqs_si_device", "aiqs_si_device.*"]
